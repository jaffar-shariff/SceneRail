<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
<title id="title">SceneRail production workflow</title>
<desc id="desc">Six connected stages: define the brief, shape the story, choose a visual system, plan purposeful scenes, compose and render, then review and verify the MP4 output.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b111a"/><stop offset=".58" stop-color="#111e2e"/><stop offset="1" stop-color="#171b31"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#54e5ce"/><stop offset=".52" stop-color="#59bdeb"/><stop offset="1" stop-color="#b28cff"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#829cb8" stroke-width=".7" fill="none" opacity=".12"/></pattern>
 <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".3"/></filter>
</defs>
<rect width="1600" height="420" rx="22" fill="url(#bg)"/><rect width="1600" height="420" rx="22" fill="url(#grid)"/>
<text x="54" y="53" fill="#78e7d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3.2">THE SCENERAIL METHOD</text>
<text x="54" y="91" fill="#f3f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750">A production pipeline built around the story</text>
<text x="54" y="119" fill="#a9bdd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Visuals are chosen for the job each scene must do—not added as decoration.</text>
<path d="M117 246 H1484" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity=".75"/>
<g filter="url(#shadow)" transform="translate(50 151)"><rect width="220" height="190" rx="15" fill="#172636" stroke="#54e5ce" stroke-opacity=".55" stroke-width="1.4"/><rect x="14" y="14" width="62" height="62" rx="11" fill="#54e5ce" fill-opacity=".12" stroke="#54e5ce" stroke-opacity=".22"/><g transform="translate(13 14)"><path d="M24 19 H55 M24 31 H49 M24 43 H44" stroke="#54e5ce" stroke-width="3" stroke-linecap="round"/><rect x="16" y="11" width="48" height="47" rx="7" stroke="#54e5ce" fill="none" stroke-width="2"/></g><circle cx="190" cy="28" r="15" fill="#54e5ce" fill-opacity=".16" stroke="#54e5ce" stroke-opacity=".65"/><text x="190" y="33" text-anchor="middle" fill="#54e5ce" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800">01</text><text x="16" y="105" fill="#f2f6fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Define the brief</text><text x="16" y="135" fill="#aec1d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Audience, platform,</text><text x="16" y="155" fill="#aec1d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">duration and purpose</text><rect x="16" y="174" width="55" height="3" rx="2" fill="#54e5ce"/></g><g filter="url(#shadow)" transform="translate(305 151)"><rect width="220" height="190" rx="15" fill="#172636" stroke="#61c7ed" stroke-opacity=".55" stroke-width="1.4"/><rect x="14" y="14" width="62" height="62" rx="11" fill="#61c7ed" fill-opacity=".12" stroke="#61c7ed" stroke-opacity=".22"/><g transform="translate(13 14)"><path d="M18 45 L30 33 L39 39 L57 18" fill="none" stroke="#61c7ed" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="45" r="4" fill="#61c7ed"/><circle cx="30" cy="33" r="4" fill="#61c7ed"/><circle cx="39" cy="39" r="4" fill="#61c7ed"/><circle cx="57" cy="18" r="4" fill="#61c7ed"/></g><circle cx="190" cy="28" r="15" fill="#61c7ed" fill-opacity=".16" stroke="#61c7ed" stroke-opacity=".65"/><text x="190" y="33" text-anchor="middle" fill="#61c7ed" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800">02</text><text x="16" y="105" fill="#f2f6fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Shape the story</text><text x="16" y="135" fill="#aec1d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Research, thesis,</text><text x="16" y="155" fill="#aec1d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">script and progression</text><rect x="16" y="174" width="55" height="3" rx="2" fill="#61c7ed"/></g><g filter="url(#shadow)" transform="translate(560 151)"><rect width="220" height="190" rx="15" fill="#172636" stroke="#bb96ff" stroke-opacity=".55" stroke-width="1.4"/><rect x="14" y="14" width="62" height="62" rx="11" fill="#bb96ff" fill-opacity=".12" stroke="#bb96ff" stroke-opacity=".22"/><g transform="translate(13 14)"><circle cx="25" cy="29" r="12" stroke="#bb96ff" stroke-width="3" fill="none"/><rect x="40" y="17" width="20" height="24" rx="4" fill="#bb96ff"/><path d="M19 51 H55" stroke="#bb96ff" stroke-width="3" stroke-linecap="round"/></g><circle cx="190" cy="28" r="15" fill="#bb96ff" fill-opacity=".16" stroke="#bb96ff" stroke-opacity=".65"/><text x="190" y="33" text-anchor="middle" fill="#bb96ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800">03</text><text x="16" y="105" fill="#f2f6fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Choose a style</text><text x="16" y="135" fill="#aec1d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">One lead visual grammar</text><text x="16" y="155" fill="#aec1d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">from 37 original recipes</text><rect x="16" y="174" width="55" height="3" rx="2" fill="#bb96ff"/></g><g filter="url(#shadow)" transform="translate(815 151)"><rect width="220" height="190" rx="15" fill="#172636" stroke="#ffbd68" stroke-opacity=".55" stroke-width="1.4"/><rect x="14" y="14" width="62" height="62" rx="11" fill="#ffbd68" fill-opacity=".12" stroke="#ffbd68" stroke-opacity=".22"/><g transform="translate(13 14)"><rect x="15" y="14" width="19" height="18" rx="3" stroke="#ffbd68" fill="none" stroke-width="2.5"/><rect x="41" y="14" width="19" height="18" rx="3" fill="#ffbd68" opacity=".35" stroke="#ffbd68" stroke-width="2.5"/><rect x="15" y="39" width="19" height="18" rx="3" fill="#ffbd68" opacity=".35" stroke="#ffbd68" stroke-width="2.5"/><rect x="41" y="39" width="19" height="18" rx="3" stroke="#ffbd68" fill="none" stroke-width="2.5"/></g><circle cx="190" cy="28" r="15" fill="#ffbd68" fill-opacity=".16" stroke="#ffbd68" stroke-opacity=".65"/><text x="190" y="33" text-anchor="middle" fill="#ffbd68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800">04</text><text x="16" y="105" fill="#f2f6fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Craft each scene</text><text x="16" y="135" fill="#aec1d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Viewer question, visual</text><text x="16" y="155" fill="#aec1d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">argument and action</text><rect x="16" y="174" width="55" height="3" rx="2" fill="#ffbd68"/></g><g filter="url(#shadow)" transform="translate(1070 151)"><rect width="220" height="190" rx="15" fill="#172636" stroke="#ff7fa6" stroke-opacity=".55" stroke-width="1.4"/><rect x="14" y="14" width="62" height="62" rx="11" fill="#ff7fa6" fill-opacity=".12" stroke="#ff7fa6" stroke-opacity=".22"/><g transform="translate(13 14)"><rect x="13" y="15" width="50" height="39" rx="7" stroke="#ff7fa6" stroke-width="2.5" fill="none"/><path d="M31 23 L31 46 L49 34 Z" fill="#ff7fa6"/></g><circle cx="190" cy="28" r="15" fill="#ff7fa6" fill-opacity=".16" stroke="#ff7fa6" stroke-opacity=".65"/><text x="190" y="33" text-anchor="middle" fill="#ff7fa6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800">05</text><text x="16" y="105" fill="#f2f6fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Compose and render</text><text x="16" y="135" fill="#aec1d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Timing, narration,</text><text x="16" y="155" fill="#aec1d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">captions, sound and motion</text><rect x="16" y="174" width="55" height="3" rx="2" fill="#ff7fa6"/></g><g filter="url(#shadow)" transform="translate(1325 151)"><rect width="220" height="190" rx="15" fill="#172636" stroke="#63e3a6" stroke-opacity=".55" stroke-width="1.4"/><rect x="14" y="14" width="62" height="62" rx="11" fill="#63e3a6" fill-opacity=".12" stroke="#63e3a6" stroke-opacity=".22"/><g transform="translate(13 14)"><circle cx="38" cy="34" r="23" stroke="#63e3a6" stroke-width="3" fill="none"/><path d="M25 34 L34 43 L51 25" stroke="#63e3a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="190" cy="28" r="15" fill="#63e3a6" fill-opacity=".16" stroke="#63e3a6" stroke-opacity=".65"/><text x="190" y="33" text-anchor="middle" fill="#63e3a6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800">06</text><text x="16" y="105" fill="#f2f6fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Review and verify</text><text x="16" y="135" fill="#aec1d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Inspect frames, validate</text><text x="16" y="155" fill="#aec1d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">and confirm final MP4</text><rect x="16" y="174" width="55" height="3" rx="2" fill="#63e3a6"/></g>
<text x="54" y="389" fill="#7f97ad" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2">PLAN WITH INTENT  /  ANIMATE TO EXPLAIN  /  VERIFY THE ACTUAL OUTPUT</text>
</svg>