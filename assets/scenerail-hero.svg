<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="410" viewBox="0 0 1440 410" role="img" aria-labelledby="title desc">
<title id="title">SceneRail — agent-native video production toolkit</title><desc id="desc">An original identity showing a production flow from story and style through scene planning and motion to a verified MP4 export.</desc>
