<text x="73" y="380" fill="#7e93a7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2.2">STORY FIRST  /  MOTION WITH PURPOSE  /  INSPECT THE RENDER</text>
