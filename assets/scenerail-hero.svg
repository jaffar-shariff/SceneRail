<text x="72" y="202" fill="#f6f8fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650">From a clear story to a verified cut.</text><text x="72" y="237" fill="#afc1d2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Narrative planning, original visual systems, scene craft,</text><text x="72" y="263" fill="#afc1d2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">frame-accurate motion, and measurable render checks.</text>
