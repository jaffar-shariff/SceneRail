<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Type Pulse — original Masteraiskill visual study</title>
<desc id="desc">An original vector composition illustrating the visual grammar of the Type Pulse production recipe. It is an illustrative design sample, not factual evidence or a finished video.</desc>
