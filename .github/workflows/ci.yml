name: Masteraiskill CI

concurrency:
  group: masteraiskill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  timeline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package metadata JSON
        run: python -m json.tool package.json > /dev/null
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check local Markdown links
        run: python scripts/check_repo_links.py
      - name: Validate example timeline
        run: python scripts/validate_timeline.py examples/timeline.json --strict
      - name: Validate example storyboard
        run: python scripts/validate_storyboard.py examples/storyboard.json --strict --report out/qa/storyboard-report.json
      - name: Upload storyboard validation report
        uses: actions/upload-artifact@v4
        with:
          name: masteraiskill-storyboard-contract-report
          path: out/qa/storyboard-report.json
          if-no-files-found: error

  remotion-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure Remotion browser
        run: npx remotion browser ensure
      - name: Install FFmpeg for MP4 verification
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Type-check renderer
        run: npx tsc --noEmit
      - name: Render sample MP4
        run: npm run render:sample
      - name: Verify MP4 metadata
        run: python scripts/probe_mp4.py out/masteraiskill-demo.mp4 --expect-size 1920x1080 --expect-fps 30
      - name: Install contact-sheet helper
        run: python -m pip install --disable-pip-version-check -r requirements-qa.txt
      - name: Sample frames and create contact sheet
        run: |
          python scripts/render_qa_frames.py out/masteraiskill-demo.mp4 --count 12 --output-dir out/qa/frames
          python scripts/create_contact_sheet.py out/qa/frames --output out/qa/contact-sheet.png
      - name: Upload sample MP4
        uses: actions/upload-artifact@v4
        with:
          name: masteraiskill-sample-mp4
          path: |
            out/masteraiskill-demo.mp4
            out/qa/contact-sheet.png
            out/qa/frames/
          if-no-files-found: error
